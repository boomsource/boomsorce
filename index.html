<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('assets/bgr.png') no-repeat center center;
            background-size: cover;
            background-color: #1a1a1a;
        }

        .video-wrapper {
            position: relative;
            z-index: 10;
            width: 65%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ================= 1. ANIMATION CỘT SÓNG GÓC TRÊN ================= */
        .buffer-indicator {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            border-radius: 6px;
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .buffer-indicator .bar {
            width: 3.5px;
            height: 16px;
            background-color: #ffffff;
            border-radius: 2px;
            animation: soundWave 0.8s ease-in-out infinite alternate;
        }

        .buffer-indicator .bar:nth-child(1) { animation-delay: 0s; }
        .buffer-indicator .bar:nth-child(2) { animation-delay: 0.25s; }
        .buffer-indicator .bar:nth-child(3) { animation-delay: 0.5s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.25); opacity: 0.4; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* ================= 2. ANIMATION BÌNH TAM GIÁC Ở GIỮA ================= */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65); /* Làm mờ nền để nhìn thấy video phía dưới */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .cup-animation {
            width: 313px;
            height: 627px;
            background-image: url('assets/cup.png'), url('cup.png');
            background-repeat: no-repeat;
            background-position: 0 0;
            animation: playCup 1.2s steps(8) infinite;
            transform: scale(0.25);
            margin: -210px 0;
        }

        @keyframes playCup {
            from { background-position-y: 0px; }
            to { background-position-y: -5016px; }
        }

        .loading-text {
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .dots::after {
            content: '';
            animation: loadingDots 1.5s infinite steps(4, jump-none);
        }

        @keyframes loadingDots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* CLASS ĐỂ ẨN ĐỒNG BỘ CẢ 2 */
        .is-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <div class="video-wrapper" id="videoWrapper">
        <!-- 1. Cột sóng góc phải -->
        <div class="buffer-indicator" id="bufferIndicator">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <!-- 2. Bình tam giác ở giữa -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="cup-animation"></div>
            <div class="loading-text">Đang tải video<span class="dots"></span></div>
        </div>

        <video id="mainVideo" controls controlsList="nodownload">
            <source src="assets/video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const overlay = document.getElementById('loadingOverlay');
        const bufferIndicator = document.getElementById('bufferIndicator');
        const wrapper = document.getElementById('videoWrapper');
        const fallbackEmbedLink = "https://streamable.com/e/rqs315?autoplay=1";

        // Hàm HIỆN đồng thời cả Bình tam giác và Cột sóng
        const showBuffering = () => {
            overlay.classList.remove('is-hidden');
            bufferIndicator.classList.remove('is-hidden');
        };

        // Hàm ẨN đồng thời cả Bình tam giác và Cột sóng
        const hideBuffering = () => {
            overlay.classList.add('is-hidden');
            bufferIndicator.classList.add('is-hidden');
        };

        // Khi video nạp đủ dữ liệu ban đầu -> Ẩn cả 2
        video.addEventListener('canplay', hideBuffering);

        // KHI VIDEO BỊ KHỰNG / ĐỨNG ĐỂ TẢI TIẾP DỮ LIỆU -> Hiện cả 2
        video.addEventListener('waiting', showBuffering);
        video.addEventListener('stalled', showBuffering);

        // Khi người dùng tua video và phải đợi tải -> Hiện cả 2
        video.addEventListener('seeking', showBuffering);

        // KHI VIDEO TIẾP TỤC PHÁT BÌNH THƯỜNG -> Ẩn cả 2
        video.addEventListener('playing', hideBuffering);
        video.addEventListener('canplaythrough', hideBuffering);
        video.addEventListener('seeked', hideBuffering);

        // Nếu người dùng bấm Tạm dừng (Pause) chủ động thì ẩn hiệu ứng đi
        video.addEventListener('pause', () => {
            if (!video.seeking) {
                hideBuffering();
            }
        });

        // Xử lý link dự phòng iframe (nếu không có file video.mp4 cục bộ)
        video.querySelector('source').addEventListener('error', () => {
            video.remove();
            const iframe = document.createElement('iframe');
            iframe.src = fallbackEmbedLink;
            iframe.allow = "fullscreen; autoplay";
            iframe.onload = hideBuffering;
            wrapper.appendChild(iframe);
        });

        // Chặn phím tắt và chuột phải
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && ['u', 's', 'c'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
